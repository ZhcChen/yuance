name: Desktop Security

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "desktop/**"
      - "api/**"
      - "docs/openapi/**"
      - "frontend/packages/app-core/**"
      - "frontend/packages/platform-contract/**"
      - "frontend/packages/ui/**"
      - "frontend/package-lock.json"
      - ".github/workflows/desktop-security.yml"
      - ".github/workflows/release-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "api/**"
      - "docs/openapi/**"
      - "frontend/packages/app-core/**"
      - "frontend/packages/platform-contract/**"
      - "frontend/packages/ui/**"
      - "frontend/package-lock.json"
      - ".github/workflows/desktop-security.yml"
      - ".github/workflows/release-desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install shared frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Run focused Device API tests
        run: cargo test --manifest-path api/Cargo.toml --test desktop_enrollment_contract_flow --test device_access_auth_flow --test device_sse_authorization_flow

      - name: Run desktop checks
        run: npm --prefix desktop run check

      - name: Run desktop tests
        if: runner.os != 'Linux'
        run: npm --prefix desktop test

      - name: Run Linux desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop test

      - name: Scan credential artifacts
        run: npm --prefix desktop run scan:credential-leaks

      - name: Build unpacked desktop app
        run: npm --prefix desktop run pack:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged ASAR
        run: npm --prefix desktop run verify:bundle -- dist

      - name: Smoke unpacked app protocol
        if: runner.os != 'Linux'
        run: npm --prefix desktop run smoke:app-protocol -- dist

      - name: Smoke Linux unpacked app protocol
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:app-protocol -- dist

      - name: Scan unpacked credential artifacts
        run: npm --prefix desktop run scan:credential-leaks -- dist

      - name: Verify native safeStorage boundary
        if: runner.os != 'Linux'
        run: npm --prefix desktop run smoke:safe-storage && npm --prefix desktop run smoke:single-instance

      - name: Verify Linux safeStorage fail-closed boundary
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:safe-storage && xvfb-run -a npm --prefix desktop run smoke:single-instance
