name: Release Desktop

on:
  push:
    tags:
      - "desktop-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate desktop release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install shared frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Verify release tag
        run: npm --prefix desktop run verify:release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Run desktop tests
        if: runner.os != 'Linux'
        run: npm --prefix desktop test

      - name: Run Linux desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop test

  build:
    name: Build ${{ matrix.platform.name }} ${{ matrix.platform.arch }}
    needs: validate-tag
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            target: --mac
            arch: arm64
            arch_flag: --arm64
            artifact: desktop-macos-arm64
          - name: macOS
            runner: macos-15-intel
            target: --mac
            arch: x64
            arch_flag: --x64
            artifact: desktop-macos-x64
          - name: Windows
            runner: windows-latest
            target: --win
            arch: x64
            arch_flag: --x64
            artifact: desktop-windows-x64
          - name: Windows
            runner: windows-11-arm
            target: --win
            arch: arm64
            arch_flag: --arm64
            artifact: desktop-windows-arm64
          - name: Linux
            runner: ubuntu-latest
            target: --linux
            arch: x64
            arch_flag: --x64
            artifact: desktop-linux-x64
          - name: Linux
            runner: ubuntu-24.04-arm
            target: --linux
            arch: arm64
            arch_flag: --arm64
            artifact: desktop-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install shared frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Run desktop tests
        if: runner.os != 'Linux'
        run: npm --prefix desktop test

      - name: Run Linux desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop test

      - name: Verify native safeStorage boundary
        if: runner.os != 'Linux'
        run: npm --prefix desktop run smoke:safe-storage && npm --prefix desktop run smoke:single-instance

      - name: Verify Linux safeStorage fail-closed boundary
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:safe-storage && xvfb-run -a npm --prefix desktop run smoke:single-instance

      - name: Build installer and unpacked staging app
        run: npm --prefix desktop run dist:ci -- ${{ matrix.platform.target }} ${{ matrix.platform.arch_flag }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify unpacked ASAR
        run: npm --prefix desktop run verify:bundle -- dist

      - name: Smoke unpacked app protocol
        if: runner.os != 'Linux'
        run: npm --prefix desktop run smoke:app-protocol -- dist

      - name: Smoke Linux unpacked app protocol
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix desktop run smoke:app-protocol -- dist

      - name: Scan packaged credential artifacts
        run: npm --prefix desktop run scan:credential-leaks -- dist

      - name: Collect release asset
        run: node desktop/scripts/collect-release-assets.mjs desktop/dist .artifacts/release-assets

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact }}
          path: .artifacts/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download installer assets
        uses: actions/download-artifact@v8
        with:
          path: .artifacts/downloaded-assets

      - name: Normalize release assets
        run: node desktop/scripts/collect-release-assets.mjs .artifacts/downloaded-assets .artifacts/publish-assets --require-complete

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" .artifacts/publish-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "元策桌面端 $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" .artifacts/publish-assets/* --title "元策桌面端 $RELEASE_TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
