[package]
name = "yuance-agent"
version = "0.1.4"
edition = "2024"
rust-version = "1.94"
description = "Codex Skill CLI for the Yuance OpenAPI"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.31"
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["fs", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
