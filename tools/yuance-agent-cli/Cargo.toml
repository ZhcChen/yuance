[package]
name = "yuance-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Codex Skill CLI for the Yuance OpenAPI"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
