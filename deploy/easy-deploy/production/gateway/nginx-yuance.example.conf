# qfy-sc-test 当前公网 Nginx 的 Yuance server block。
# 将现有 qfy-443-frp-web.conf 中同一 server_name 的块替换为本模板，
# 不要与旧块并存，否则会产生重复 server_name。
server {
    listen 443 ssl http2;
    server_name yuance.quanxinfu.com;

    ssl_certificate /etc/letsencrypt/live/yuance.quanxinfu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuance.quanxinfu.com/privkey.pem;

    proxy_intercept_errors on;
    error_page 502 503 504 =200 /__yuance_updating;

    location / {
        proxy_pass http://127.0.0.1:40000;
        include /etc/nginx/snippets/qfy-proxy-http.conf;
        proxy_intercept_errors on;
    }

    location = /__yuance_updating {
        internal;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Retry-After "5" always;
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>系统正在更新中 - 元策</title><style>:root{color-scheme:light;--bg:#f4f7fb;--text:#162033;--muted:#60708a;--accent:#2f6fed;--border:#dbe4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,520px);padding:36px 32px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:center;box-shadow:0 14px 36px rgba(22,32,51,.08)}h1{margin:0 0 10px;font-size:26px;line-height:1.3}p{margin:0;color:var(--muted)}.mark{width:48px;height:48px;margin:0 auto 20px;border:4px solid #c9d8f7;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.mark{animation:none}}</style></head><body><main role="status" aria-live="polite"><div class="mark" aria-hidden="true"></div><h1>系统正在更新中</h1><p>服务正在短暂重启，请稍后重试。</p></main><script>setTimeout(function(){location.reload()},5000)</script></body></html>';
    }
}
